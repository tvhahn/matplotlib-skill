# Benchmark prompt suite for scripts/benchmark.py
#
# Two kinds of prompts:
#   pattern   — the request maps to one of the P1–P9 pattern files
#   offpattern — realistic requests with no dedicated pattern (scatter, line,
#               histogram, grouped bar) or a vague question where the chart
#               type must be chosen. These test whether the skill generalises
#               or forces data into the nearest template.
#
# `checks` are facts a correct chart must reflect. The judge verifies them
# against the rendered PNG (e.g. a wrong groupby or a dropna() that discards
# most rows will show up as wrong numbers).

- id: p1-titanic
  kind: pattern
  pattern: P1
  prompt: "horizontal bar chart of survival rate by passenger class from data/raw/public/titanic.csv"
  checks:
    - "Survival rates are ~63% (1st), ~47% (2nd), ~24% (3rd). Values near 68/80/50% mean rows were wrongly dropped by a blanket dropna()."

- id: p2-mpg
  kind: pattern
  pattern: P2
  prompt: "vertical bar chart of average horsepower by number of cylinders from data/raw/public/mpg.csv"
  checks:
    - "Five cylinder groups (3, 4, 5, 6, 8); 8-cylinder average is ~158 hp, 4-cylinder ~78 hp."

- id: p3-globaltemp
  kind: pattern
  pattern: P3
  prompt: "time series bar chart with rolling mean from data/raw/precomputed/p3/global_temp.csv — columns are year, value, rolling"
  checks:
    - "Covers ~1880 to ~2025 with recent years clearly warmest."

- id: p4-penguins
  kind: pattern
  pattern: P4
  prompt: "violin plot of penguin body mass by species from data/raw/public/penguins.csv"
  checks:
    - "Three species; Gentoo is clearly heaviest (median ~5000 g), Adelie and Chinstrap ~3700 g."

- id: p5-glue
  kind: pattern
  pattern: P5
  prompt: "lollipop chart of model score range across NLP tasks from data/raw/precomputed/p5/glue.csv — columns are name, min, max, avg"
  checks:
    - "Eight models; ERNIE has the highest average (~89.7)."

- id: p7-mpg
  kind: pattern
  pattern: P7
  prompt: "correlation heatmap from data/raw/precomputed/p7/mpg.csv — pre-computed correlation matrix, load with pd.read_csv(index_col=0), annotate cells"
  checks:
    - "5x5 matrix; mpg is strongly negatively correlated with weight/displacement/horsepower."

- id: p8-chickweight
  kind: pattern
  pattern: P8
  prompt: "multi-panel of chick weight over time from data/raw/public/chickweight.csv — one subplot per diet"
  checks:
    - "Four panels (one per diet), shared y-axis so diets are comparable."

- id: p9-titanic
  kind: pattern
  pattern: P9
  prompt: "PR and ROC curves from data/raw/precomputed/p9/titanic.npz — load with np.load, arrays: precision_array, recall_array, tpr_array, fpr_array, precision_avg, recall_avg, tpr_avg, fpr_avg, baseline"
  checks:
    - "Two panels (PR and ROC) with fold curves, an average curve, and a no-skill baseline."

- id: x-stocks-line
  kind: offpattern
  prompt: "line chart of stock prices over time for each company in data/raw/public/stocks.csv"
  checks:
    - "A multi-line chart (not bars) with one line per symbol (AAPL, AMZN, GOOG, IBM, MSFT); dates on x-axis 2000–2010."

- id: x-gapminder-scatter
  kind: offpattern
  prompt: "scatter plot of GDP per capita vs life expectancy in 2007 from data/raw/public/gapminder.csv, coloured by continent"
  checks:
    - "Points for ~180 countries in 2007 only; GDP per capita on a log scale is preferable; positive relationship visible."

- id: x-taxis-hist
  kind: offpattern
  prompt: "histogram of taxi fares from data/raw/public/taxis.csv"
  checks:
    - "A histogram (not bars per category) of the fare column; right-skewed with most fares under $20."

- id: x-titanic-grouped
  kind: offpattern
  prompt: "compare survival rates by passenger class and sex from data/raw/public/titanic.csv"
  checks:
    - "Both class and sex are shown. Female 1st-class survival ~97%, male 3rd-class ~14%. Large deviations suggest a blanket dropna()."

- id: p6-wine
  kind: pattern
  pattern: P6
  prompt: "decision boundary plot from data/raw/precomputed/p6/wine.npz — load with np.load(allow_pickle=True); arrays: mesh_x0, mesh_x1, yy_hat, yy_prob, X, y, class_names, feature_names"
  checks:
    - "Three classes with coloured regions and the training points overlaid; axes are alcohol and malic acid."

# --- Output modes (v3) ---

- id: m-publication-tips
  kind: mode
  prompt: "publication-quality figure, 300 DPI, of average tip as a percentage of the total bill by day of the week from data/raw/public/tips.csv"
  checks:
    - "Four days in natural order (Thur, Fri, Sat, Sun), tip percentage around 15-17%; saved as PDF and PNG at 300 DPI."

- id: m-quick-seattle
  kind: mode
  prompt: "quick exploratory plot of daily precipitation over time in data/raw/public/seattle_weather.csv"
  checks:
    - "Precipitation over 2012-2015 with wet winters and dry summers visible; PNG only is fine."

- id: m-function-happiness
  kind: mode
  prompt: "add a function plot_region_scores(df) to plots.py that draws mean happiness score by region from data/raw/public/world_happiness.csv, and a short script make_figures.py that calls it and saves the figure to figures/"
  checks:
    - "Seven regions; North America highest (~7.2), Europe and Africa lowest (~4.1-4.2). Function returns fig, ax."

# --- Chart types beyond P1–P9 (v3.1 router + new patterns) ---

- id: n-slope-gapminder
  kind: newchart
  prompt: "how did life expectancy by continent change between 1952 and 2007? data in data/raw/public/gapminder.csv"
  checks:
    - "Two time points per continent (a slope or dumbbell chart is ideal). Africa 39→55, Americas 53→73, Asia 46→71, Europe 64→77, Oceania 69→71. FSU has no 1952 value."

- id: n-dumbbell-healthexp
  kind: newchart
  prompt: "compare health spending per capita in 1970 and 2020 for each country in data/raw/public/healthexp.csv"
  checks:
    - "Before/after per country (dumbbell, slope or paired bars). USA ~327→11859, far above the others in 2020. Canada has no 1970 value."

- id: n-mix-iowa
  kind: newchart
  prompt: "show how the mix of Iowa's electricity generation sources changed over time, from data/raw/public/iowa_electricity.csv"
  checks:
    - "Part-to-whole over 2001–2017 (stacked area or 100% stacked bars). Renewables rise from ~3% to ~39%; fossil fuels fall from ~87% to ~52%."

- id: n-ecdf-taxis
  kind: newchart
  prompt: "ECDF of taxi trip distance for cash vs credit card payments from data/raw/public/taxis.csv"
  checks:
    - "Two step curves (cash, credit card) from 0 to 1; credit-card trips tend to be longer."

- id: n-ridgeline-seattle
  kind: newchart
  prompt: "show how the distribution of daily maximum temperature shifts across the months of the year, from data/raw/public/seattle_weather.csv"
  checks:
    - "Twelve months in calendar order; medians ~8 °C in Jan/Dec rising to ~26 °C in Jul/Aug."

- id: n-training-cancer
  kind: newchart
  prompt: "plot the training and validation loss curves from data/raw/precomputed/ml/training_breast_cancer.csv (columns epoch, train_loss, val_loss, train_acc, val_acc)"
  checks:
    - "Two loss curves over 80 epochs; validation loss bottoms out near epoch 37 (~0.09) and creeps back up while training loss keeps falling (overfitting)."

- id: n-confusion-wine
  kind: newchart
  prompt: "confusion matrix from data/raw/precomputed/ml/predictions_wine.csv (columns y_true, y_pred)"
  checks:
    - "3x3 matrix for class_0/1/2; overall accuracy ~82%; class_1 is classified best (62/71); class_2 is most often mistaken for class_0 (9)."
